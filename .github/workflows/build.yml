name: Build macOS Audio Unit

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-au:
    runs-on: macos-14

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: cmake -B build -G "Unix Makefiles" -DCMAKE_BUILD_TYPE=Release

      - name: Build AU target
        run: cmake --build build --target BenBocazStudioPro_AU --config Release -j$(sysctl -n hw.ncpu)

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: BenBocazStudioPro-AU-macOS
          path: build/BenBocazStudioPro_artefacts/Release/AU/Ben Bocaz Studio Pro.component
