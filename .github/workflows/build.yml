name: Build macOS AU Plugin

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build AU target
        run: |
          cmake --build build --config Release --target BenBocazStudioPro_AU

      - name: Package AU artifact
        run: |
          mkdir -p artifacts
          find build -name "*.component" -exec cp -R {} artifacts/ \;

      - name: Upload AU artifact
        uses: actions/upload-artifact@v4
        with:
          name: Los-Andes-Capital-AU-${{ github.ref_name }}-arm64
          path: artifacts/
