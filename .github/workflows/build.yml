name: Build macOS Plugin

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-15-intel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake
        run: |
          cmake -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build AU and VST3 targets
        run: |
          cmake --build build --config Release --target BenBocazStudioPro_AU BenBocazStudioPro_VST3

      - name: Package artifacts
        run: |
          mkdir -p artifacts
          find build -name "*.component" -exec cp -R {} artifacts/ \;
          find build -name "*.vst3" -exec cp -R {} artifacts/ \;

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Los-Andes-Capital-macOS-arm64
          path: artifacts/
